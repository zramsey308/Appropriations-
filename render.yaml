services:
  - type: web
    name: tx11-appropriations-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -c "from app.seed_accounts import seed_accounts; seed_accounts()" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set this manually in Render dashboard with your Supabase URL
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"  # Set to "true" and add other env vars to enable
      - key: PYTHON_VERSION
        value: 3.11.0
