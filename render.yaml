databases:
  - name: atlas-ops-db
    databaseName: appropriations_db
    user: appropriations

services:
  - type: web
    name: tx11-appropriations-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -c "from app.seed_accounts import seed_accounts; seed_accounts()" && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-ops-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false  # Set this manually in Render dashboard (e.g. https://xxxx.supabase.co)
      - key: SUPABASE_SERVICE_KEY
        sync: false  # Set this manually in Render dashboard (service_role key from Supabase)
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"  # Set to "true" and add other env vars to enable
      - key: PYTHON_VERSION
        value: 3.11.0
